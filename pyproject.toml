[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meme-seeder"
version = "0.1.0"
description = "Scraper and LLM enricher for seeding meme template databases"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "beautifulsoup4>=4.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
meme-seeder = "meme_seeder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meme_seeder"]

[tool.ruff]
line-length = 100
